# The Modular Computers manual, built by GitHub Pages' own Jekyll (no plugins, no theme).
title: Modular Computers
description: Build computers in Minecraft and program them in Lua.
url: https://payonel.github.io
baseurl: /modularcomputers
permalink: pretty
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
highlighter: rouge

# The example programs live in docs/examples, are published there for download, and are what
# `{% include name.lua %}` shows in a page (tested: McosTest runs them, DocsLuaTest compiles them).
includes_dir: examples

# The sidebar's sections, in order. A page joins one with `section:` and is placed in it by `order:`.
wiki_sections:
  - Start
  - Concepts
  - Hardware
  - Devices
  - mcos
  - Programs
  - Tutorials
  - Your own OS

defaults:
  - scope: { path: "" }
    values: { layout: default }
