// LungoLua, the Lua engine (the user's separate project, com.payonel.lungolua), built from its
// sources in place (gradle.properties: lungolua_dir) and nested in the mod's jar. Its standalone
// interpreter, its JLine line editor and its test launchers stay out.
plugins {
	id 'java-library'
}

def lungoluaDir = rootProject.file(rootProject.property('lungolua_dir'))
// The mod uses the engine by its package, com.payonel.lungolua (lua-java 4f9a9536 and later).
if (!new File(lungoluaDir, 'src/com/payonel/lungolua').isDirectory()) {
	throw new GradleException("LungoLua's sources aren't at ${lungoluaDir}/src/com/payonel/lungolua: " +
		"check out (or pull) the lua-java branch of lua-java there, at 4f9a9536 or later, or set lungolua_dir in gradle.properties")
}
group = 'com.payonel'
version = '0.1.0'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

sourceSets {
	main {
		java {
			srcDirs = [new File(lungoluaDir, 'src')]
			exclude '**/host/**'
			exclude '**/platform/Readline.java'
			exclude '**/tests/libs/**'
			exclude '**/tests/EngineTests.java'
			exclude '**/tests/Gate.java'
			exclude '**/tests/PublicApi.java'
			exclude '**/tests/StyxTests.java'
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 21
	options.encoding = 'UTF-8'
	options.compilerArgs += ['-Xmaxerrs', '10000']
}
