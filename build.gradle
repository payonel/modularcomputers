plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

// Published version carries the Minecraft version as SemVer build metadata: 0.1.0+26.3.
// Fabric Loader ignores build metadata when comparing versions. See docs/VERSIONING.md.
version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"modularcomputers" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	// Creates the `gametest` source set plus the runGameTest / runClientGameTest tasks.
	configureTests {
		createSourceSet = true
		modId = "modularcomputers-gametest"
		enableGameTests = true
		enableClientGameTests = true
		eula = true
	}
}

configurations {
	// Third-party mod jars to install alongside ours in production-style test runs.
	productionRuntimeMods {
		transitive = false
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Unit tests: plain JUnit, with fabric-loader-junit so tests can bootstrap Minecraft registries.
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
	testImplementation "org.mockito:mockito-core:${project.mockito_version}"
	testImplementation "org.assertj:assertj-core:${project.assertj_version}"

	productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// The test-harness modules are not bundled in the release fabric-api jar.
	productionRuntimeMods fabricApi.module("fabric-gametest-api-v1", project.fabric_api_version)
	productionRuntimeMods fabricApi.module("fabric-client-gametest-api-v1", project.fabric_api_version)
}

tasks.withType(ProcessResources).configureEach {
	def props = [
		version               : project.version,
		minecraft_version_range: project.minecraft_version_range,
		loader_version        : project.loader_version,
	]
	inputs.properties props

	filesMatching("fabric.mod.json") {
		expand props
	}
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

test {
	useJUnitPlatform()
	testLogging {
		events "failed", "skipped"
		exceptionFormat "full"
	}
}

def gametestJar = tasks.register("gametestJar", Jar) {
	from sourceSets.gametest.output
	archiveClassifier = "gametest"
}

// Client game tests against the jar we actually ship (not the dev classpath), on a virtual X
// server that Loom starts and stops. This is what CI runs. For quick local iteration use
// scripts/headless.sh ./gradlew runClientGameTest instead.
tasks.register("runProductionClientGameTest", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	group = "verification"
	description = "Starts the Minecraft client on Xvfb with the release jar, runs client game tests, and exits."
	mods.from(tasks.named("jar"), gametestJar, configurations.productionRuntimeMods)
	jvmArgs.add("-Dfabric.client.gametest")
	useXVFB = true
	runDir = layout.buildDirectory.dir("run/productionClientGameTest")
	// A missing test entrypoint leaves the client idling on the title screen forever; never hang CI.
	timeout = java.time.Duration.ofMinutes(10)
}

// Everything: unit tests, server game tests (both via `build`), then the headless client.
tasks.register("testAll") {
	group = "verification"
	description = "Runs unit tests, server game tests, and headless client game tests."
	dependsOn "build", "runProductionClientGameTest"
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}
