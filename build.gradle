plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
	id 'net.neoforged.moddev' version "${moddev_version}" apply false
}

// Published versions carry the Minecraft version as SemVer build metadata: 0.1.0+26.3 (each loader's
// jar is named for its loader). See docs/VERSIONING.md.
subprojects {
	apply plugin: 'java-library'

	version = "${project.mod_version}+${project.minecraft_version}"
	group = project.maven_group

	base {
		archivesName = "${project.archives_base_name}-${project.name}"
	}

	repositories {
		mavenCentral()
		maven {
			name = 'LungoLua'
			url = 'https://maven.pkg.github.com/payonel/lua'
			credentials {
				username = providers.gradleProperty('gpr.user').orElse(providers.environmentVariable('GITHUB_ACTOR')).getOrNull()
				password = providers.gradleProperty('gpr.key').orElse(providers.environmentVariable('GITHUB_TOKEN')).getOrNull()
			}
			content {
				includeModule 'com.payonel', 'lungolua'
			}
		}
		maven {
			name = 'StyxLua'
			url = 'https://maven.pkg.github.com/payonel/styxlua'
			credentials {
				username = providers.gradleProperty('gpr.user').orElse(providers.environmentVariable('GITHUB_ACTOR')).getOrNull()
				password = providers.gradleProperty('gpr.key').orElse(providers.environmentVariable('GITHUB_TOKEN')).getOrNull()
			}
			content {
				includeModule 'com.payonel', 'styxlua'
			}
		}
	}

	java {
		sourceCompatibility = JavaVersion.VERSION_25
		targetCompatibility = JavaVersion.VERSION_25
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.release = 25
		it.options.encoding = "UTF-8"
	}

	def baseName = project.archives_base_name
	def license = rootProject.file("LICENSE")
	tasks.withType(Jar).configureEach {
		from(license) {
			rename { "${it}_${baseName}" }
		}
	}
}

// Everything: each project's `build` (unit tests in common), the server game tests on both loaders,
// and the headless client tests on Fabric only (NeoForge has no client test harness; user, 2026-10-20).
tasks.register("testAll") {
	group = "verification"
	description = "Runs unit tests, the server game tests on Fabric and NeoForge, and Fabric's headless client game tests."
	dependsOn ":common:build", ":fabric:build", ":neoforge:build",
		":fabric:runGameTest", ":neoforge:runGameTestServer", ":fabric:runProductionClientGameTest"
}
