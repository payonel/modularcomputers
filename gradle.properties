org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Minecraft / Fabric -- check https://fabricmc.net/develop when moving to a new Minecraft version.
minecraft_version=26.3
# Range written to fabric.mod.json "depends.minecraft". Tighten/widen per release branch.
minecraft_version_range=~26.3
loader_version=0.19.5
loom_version=1.18.3
fabric_api_version=0.162.0+26.3

# Mod version, SemVer. The published version is ${mod_version}+${minecraft_version},
# e.g. 0.1.0+26.3 -- see docs/VERSIONING.md.
mod_version=0.1.0
maven_group=com.payonel.modularcomputers
archives_base_name=modularcomputers

junit_version=6.1.3
mockito_version=5.24.0
assertj_version=3.27.7

# LungoLua, the Lua engine (github.com/payonel/lua, branch lua-java), from its GitHub Packages build.
# Reading GitHub Packages takes a token, even for a public repo: gpr.user and gpr.key (a token with
# read:packages) in ~/.gradle/gradle.properties, or GITHUB_ACTOR and GITHUB_TOKEN in CI.
lungolua_version=0.1.0-eceb71b5
