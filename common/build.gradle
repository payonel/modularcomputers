plugins {
	id 'net.neoforged.moddev'
}

// The mod's code for every loader, compiled here against the plain game (NeoForm: Mojang's jar with
// no loader), so nothing from Fabric or NeoForge can creep in. Each loader's project compiles these
// same sources into its own jar (see fabric/ and neoforge/); this project's jar isn't shipped.
neoForge {
	neoFormVersion = project.neoform_version
	addModdingDependenciesTo(sourceSets.test)
}

// As in the shipped mod: client code may use the common code, never the other way round; the server
// game tests (loader-neutral, registered by each loader's test mod) use the common code.
sourceSets {
	client {
		compileClasspath += main.compileClasspath + main.output
		runtimeClasspath += main.runtimeClasspath + main.output
	}
	gametest {
		compileClasspath += main.compileClasspath + main.output
		runtimeClasspath += main.runtimeClasspath + main.output
	}
}

dependencies {
	// LungoLua, the Lua CPU's engine, and Styx, persisting a whole Lua state (each loader nests them).
	api "com.payonel:lungolua:${project.lungolua_version}"
	api "com.payonel:styxlua:${project.styxlua_version}"
	// Both loaders ship Mixin: common compiles against it, the loader supplies it.
	compileOnly "net.fabricmc:sponge-mixin:${project.mixin_version}"

	// Unit tests: plain JUnit; the plain game is on the classpath (SharedConstants.tryDetectVersion();
	// Bootstrap.bootStrap() fills the vanilla registries).
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
	testImplementation "org.mockito:mockito-core:${project.mockito_version}"
	testImplementation "org.assertj:assertj-core:${project.assertj_version}"
}

/** Test JVMs side by side, classes shared among them (each JVM its own statics, so no test sees another's). */
def TEST_FORKS = Math.max(1, Runtime.runtime.availableProcessors().intdiv(4))

test {
	useJUnitPlatform()
	maxParallelForks = TEST_FORKS
	// The manual's Lua is tested (DocsLuaTest, and McosTest runs docs/examples): its pages are inputs.
	inputs.dir(rootProject.file('docs')).withPropertyName('manual').withPathSensitivity(PathSensitivity.RELATIVE)
	testLogging {
		events "failed", "skipped"
		exceptionFormat "full"
	}
}
