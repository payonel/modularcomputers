plugins {
	id 'net.neoforged.moddev'
}

// The mod's code for every loader, compiled here against the plain game (NeoForm: Mojang's jar with
// no loader), so nothing from Fabric or NeoForge can creep in. Each loader's project compiles these
// same sources into its own jar (see fabric/ and neoforge/); this project's jar isn't shipped.
neoForge {
	neoFormVersion = project.neoform_version
	addModdingDependenciesTo(sourceSets.test)
}

// As in the shipped mod: client code may use the common code, never the other way round; the server
// game tests (loader-neutral, registered by each loader's test mod) use the common code.
sourceSets {
	client {
		compileClasspath += main.compileClasspath + main.output
		runtimeClasspath += main.runtimeClasspath + main.output
	}
	gametest {
		compileClasspath += main.compileClasspath + main.output
		runtimeClasspath += main.runtimeClasspath + main.output
	}
}

configurations {
	lungoluaCsharp
}

dependencies {
	// LungoLua, the Lua CPU's engine, and Styx, persisting a whole Lua state (each loader nests them).
	api "com.payonel:lungolua:${project.lungolua_version}"
	api "com.payonel:styxlua:${project.styxlua_version}"
	// Both loaders ship Mixin: common compiles against it, the loader supplies it.
	compileOnly "net.fabricmc:sponge-mixin:${project.mixin_version}"

	// Unit tests: plain JUnit; the plain game is on the classpath (SharedConstants.tryDetectVersion();
	// Bootstrap.bootStrap() fills the vanilla registries).
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
	testImplementation "org.mockito:mockito-core:${project.mockito_version}"
	testImplementation "org.assertj:assertj-core:${project.assertj_version}"
	// LungoLua's C# port, for the manual's C# example only (DocsCsharpTest): a .tar.gz holding
	// lungoluacsharp/lungolua.dll. Nothing of the mod uses it.
	lungoluaCsharp "com.payonel:lungoluacsharp:${project.lungolua_version}@tar.gz"
}

/**
 * Test JVMs side by side, classes shared among them (each JVM its own statics, so no test sees
 * another's): a JVM a core, the host's to use (the user's: the dev machine is for this).
 */
def TEST_FORKS = Runtime.runtime.availableProcessors()

// The C# port's package, unpacked for DocsCsharpTest: build/lungoluacsharp/lungolua.dll.
def unpackLungoLuaCsharp = tasks.register('unpackLungoLuaCsharp', Sync) {
	from { configurations.lungoluaCsharp.collect { tarTree(it) } }
	into layout.buildDirectory.dir('lungoluacsharp')
	eachFile { it.path = it.path.substring(it.path.indexOf('/') + 1) } // (out of its lungoluacsharp/ folder)
	includeEmptyDirs = false
}

test {
	useJUnitPlatform()
	// The manual's C# example is built and run against the C# port (DocsCsharpTest), with the .NET 10
	// SDK's dotnet: the `dotnet` Gradle property's path, else the one on PATH.
	inputs.files(unpackLungoLuaCsharp).withPropertyName('lungoluaCsharp').withPathSensitivity(PathSensitivity.RELATIVE)
	systemProperty 'modularcomputers.lungoluaCsharp', layout.buildDirectory.file('lungoluacsharp/lungolua.dll').get().asFile.absolutePath
	systemProperty 'modularcomputers.dotnet', providers.gradleProperty('dotnet').getOrElse('dotnet')
	maxParallelForks = TEST_FORKS
	// A class marked @Execution(CONCURRENT) runs its tests side by side in its JVM (McosTest, the
	// longest); every other class runs as before, a test at a time.
	systemProperty 'junit.jupiter.execution.parallel.enabled', 'true'
	systemProperty 'junit.jupiter.execution.parallel.mode.default', 'same_thread'
	systemProperty 'junit.jupiter.execution.parallel.config.strategy', 'dynamic'
	// A computer's server time a tick, a whole tick's (LuaRunner.SERVER_NANOS_PER_TICK): the host is
	// loaded flat out, and a starved test thread spent the game's millisecond before it worked.
	systemProperty 'modularcomputers.serverMillisPerTick', '50'
	// The manual's Lua is tested (DocsLuaTest, and McosTest runs docs/examples): its pages are inputs.
	inputs.dir(rootProject.file('docs')).withPropertyName('manual').withPathSensitivity(PathSensitivity.RELATIVE)
	// The field dictionary is checked against the code (FieldDictionaryTest): it's an input too, or a
	// change to it alone would leave the test up to date, never run.
	inputs.file(rootProject.file('.agents/FIELDS.md')).withPropertyName('fieldDictionary').withPathSensitivity(PathSensitivity.RELATIVE)
	testLogging {
		events "failed", "skipped"
		exceptionFormat "full"
	}
}
