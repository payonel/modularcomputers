name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read   # LungoLua and StyxLua come from GitHub Packages
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
      # The client game tests stay local (testAll): the runners' Xvfb has no OpenGL for the game.
      - name: unit tests and server game tests
        run: ./gradlew testServer
        env:
          # build.gradle reads GITHUB_ACTOR and GITHUB_TOKEN to download LungoLua and StyxLua;
          # Actions doesn't put the token in the environment by itself.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: test reports and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-output
          path: |
            */build/reports/
            */build/test-results/
            */build/run/*/logs/
      - uses: actions/upload-artifact@v7
        with:
          name: jars
          path: |
            fabric/build/libs/
            neoforge/build/libs/
