pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'NeoForged'
			url = 'https://maven.neoforged.net/releases'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	// Lets Gradle download a matching JDK (see gradle/gradle-daemon-jvm.properties),
	// so builds never depend on what the host happens to have installed.
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'modularcomputers'

// The mod is one body of code for every loader (common: the plain game's classes only) and a thin
// project per loader that starts it and hands it the loader's services (see AGENTS.md).
include 'common', 'fabric', 'neoforge'
